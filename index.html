<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"> <!-- interpretación de caracteres -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- ancho de la página se adapta automáticamente al ancho de la pantalla del dispositivo -->
<title>Escáner de accesibilidad Páramo</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background:#f5f5f3; }
  h1 { font-size: 18px; }
  button { padding: 12px 16px; font-size: 14px; border-radius: 8px; border: 1px solid #ccc; margin: 6px 0; width: 100%; cursor: pointer; }
  #btnCargar, #btnSiguiente, #btnIniciarCamara, #btnGuardarNuevoUsuario { background:#0c447c; color:white; border:none; }
  #btnNuevoUsuario, #btnCancelarNuevoUsuario, #btnBuscarDocumento, #btnCancelarBusqueda { background:#5a4a9e; color:white; border:none; }
  #btnEjecutarBusqueda { background:#0c447c; color:white; border:none; }
  #form-nuevo-usuario, #form-buscar-documento { background:white; border:1px solid #ddd; border-radius:8px; padding:16px; margin-top:8px; }
  #form-nuevo-usuario label, #form-buscar-documento label { display:block; font-size:13px; color:#555; margin-top:8px; }
  #form-nuevo-usuario input, #form-buscar-documento input { width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box; }
  #btnEntregada { background:#1a7a3c; color:white; border:none; }
  #btnNoEntregada { background:#a15c00; color:white; border:none; }
  #btnBorrar { background:#791f1f; color:white; border:none; }
  #btnExportar { background:#444; color:white; border:none; }
  #estado { font-size: 13px; color: #555; margin: 8px 0; }
  #resultado { margin-top: 16px; padding: 16px; border-radius: 8px; background: white; border: 1px solid #ddd; display:none; }
  #resultado .manilla { font-weight:bold; font-size: 16px; }
  #aviso-duplicado { background:#fff3cd; border:1px solid #e0a800; padding:12px; border-radius:8px; margin-top:12px; display:none; }
  #reader { width: 100%; margin-top: 12px; }
  #controles-finales { margin-top: 20px; border-top: 1px solid #ddd; padding-top: 12px; }
  input[type=file] { width: 100%; margin-bottom: 8px; }
</style>
</head>
<body>

<h1>Escáner de accesibilidad Páramo</h1>
<div id="estado">Sin datos del evento cargados.</div>

<!-- PANTALLA 1: cargar los datos del evento (una sola vez, con internet) -->
<div id="paso-carga">
  <p>Antes de las puertas (con internet), carga el archivo event_lookup.json:</p>
  <input type="file" id="archivoJson">
  <button id="btnCargar">Cargar datos del evento</button>
</div>

<!-- ACCIONES SIEMPRE DISPONIBLES: no dependen de haber cargado el json -->
<button id="btnNuevoUsuario">➕ Registrar nuevo usuario (sin QR previo)</button>

<div id="form-nuevo-usuario" style="display:none;">
  <label>Nombre</label>
  <input type="text" id="nu-nombre">
  <label>Tipo de documento</label>
  <input type="text" id="nu-tipodoc">
  <label>Número de documento</label>
  <input type="text" id="nu-numdoc">
  <label>Color de manilla</label>
  <input type="text" id="nu-manilla">
  <label>Especificaciones del equipo</label>
  <input type="text" id="nu-especificaciones">
  <button id="btnGuardarNuevoUsuario">Guardar y continuar</button>
  <button id="btnCancelarNuevoUsuario">Cancelar</button>
</div>

<button id="btnBuscarDocumento">🔍 Buscar por número de documento</button>

<div id="form-buscar-documento" style="display:none;">
  <label>Número de documento</label>
  <input type="text" id="bd-numdoc">
  <button id="btnEjecutarBusqueda">Buscar</button>
  <button id="btnCancelarBusqueda">Cancelar</button>
</div>

<div id="aviso-duplicado"></div>

<div id="resultado">
  <div class="manilla" id="res-manilla"></div>
  <p><b>Nombre:</b> <span id="res-nombre"></span></p>
  <p><b>Tipo de documento:</b> <span id="res-tipodoc"></span></p>
  <p><b>Número de documento:</b> <span id="res-numdoc"></span></p>
  <p><b>Especificaciones del equipo:</b> <span id="res-especificaciones"></span></p>

  <button id="btnEntregada">✅ Manilla entregada</button>
  <button id="btnNoEntregada">❌ No entregada</button>
</div>

<button id="btnSiguiente" style="display:none;">Escanear siguiente</button>

<!-- PANTALLA 2: escaneo con cámara, esta sí depende de haber cargado el json -->
<div id="paso-escaneo" style="display:none;">
  <button id="btnIniciarCamara">📷 Iniciar cámara para escanear</button>
  <div id="reader"></div>
</div>

<div id="controles-finales">
  <button id="btnExportar">Exportar registro de ingresos</button>
  <button id="btnBorrar">Exportar y borrar todo</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>

  // Guardamos una copia offline de la app la primera vez que se abre.
  // Esto envuelto en try/catch para que, si falla (por ejemplo porque
  // sw.js no existe en este lugar específico donde está publicada la
  // página), el resto de la app siga funcionando con total normalidad.

  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (error) {
    // Si falla, no pasa nada — seguimos sin la copia offline extra.
  }

  // ---------- CONFIGURACIÓN ----------
  const HORAS_EXPIRACION = 56; // borrado automático pasadas 56h de cargar los datos
  let scanner = null;
  let codigoActual = null; // guarda qué código se acaba de escanear, mientras se decide

  // ---------- PASO 0: revisar si ya hay datos cargados al abrir la app ----------
  function actualizarEstado() {
    const guardadoEn = localStorage.getItem("evento_cargado_en");
    const datos = localStorage.getItem("evento_lookup");

    if (!datos || !guardadoEn) {
      document.getElementById("estado").textContent = "Sin datos del evento cargados.";
      document.getElementById("paso-escaneo").style.display = "none";
      document.getElementById("paso-carga").style.display = "block";
      return false;
    }

    const horasTranscurridas = (Date.now() - Number(guardadoEn)) / (1000 * 60 * 60);
    if (horasTranscurridas > HORAS_EXPIRACION) {
      borrarTodo(false);
      return false;
    }

    const totalPersonas = Object.keys(JSON.parse(datos)).length;
    document.getElementById("estado").textContent =
      `Datos cargados (${totalPersonas} personas). Listo para escanear sin internet.`;
    document.getElementById("paso-carga").style.display = "none";
    document.getElementById("paso-escaneo").style.display = "block";
    return true;
  }

  // ---------- PASO 1: cargar el archivo event_lookup.json ----------
  document.getElementById("btnCargar").addEventListener("click", () => {
    const input = document.getElementById("archivoJson");
    if (!input.files.length) {
      alert("Selecciona primero el archivo event_lookup.json");
      return;
    }
    const lector = new FileReader();
    lector.onload = (e) => {
      localStorage.setItem("evento_lookup", e.target.result);
      localStorage.setItem("evento_cargado_en", Date.now().toString());
      actualizarEstado();
      // Ya NO iniciamos la cámara automáticamente aquí. El celular necesita
      // que la pidas con un toque directo (el botón de abajo), o si no,
      // no muestra ningún aviso de permiso.
    };
    lector.readAsText(input.files[0]);
  });

  // ---------- Botón explícito para iniciar la cámara ----------
  document.getElementById("btnIniciarCamara").addEventListener("click", () => {
    if (typeof Html5Qrcode === "undefined") {
      document.getElementById("reader").innerHTML =
        "<p style='color:#a11; font-weight:bold;'>No se pudo cargar la librería de la cámara.</p>" +
        "<p style='font-size:13px;'>Esto pasa si en este momento no hay internet, o algo está " +
        "bloqueando cdnjs.cloudflare.com. Revisa tu conexión y vuelve a intentar.</p>";
      return;
    }
    try {
      iniciarEscaner();
      document.getElementById("btnIniciarCamara").style.display = "none";
    } catch (error) {
      document.getElementById("reader").innerHTML =
        "<p style='color:#a11; font-weight:bold;'>Error al iniciar la cámara.</p>" +
        "<p style='font-size:13px;'>Detalle técnico: " + error + "</p>";
    }
  });

  // ---------- PASO 2: iniciar la cámara y detectar QR ----------
  function iniciarEscaner() {
    scanner = new Html5Qrcode("reader");
    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 220 },
      (codigoDetectado) => manejarEscaneo(codigoDetectado)
    ).catch((error) => {
      document.getElementById("reader").innerHTML =
        "<p style='color:#a11; font-weight:bold;'>No se pudo activar la cámara.</p>" +
        "<p style='font-size:13px;'>Detalle técnico: " + error + "</p>" +
        "<p style='font-size:13px;'>Revisa que le hayas dado permiso de cámara a esta página " +
        "en la configuración del navegador, y que ningún otro programa esté usando la cámara.</p>";
    });
  }

  // ---------- PASO 3: qué hacer cuando se detecta un código ----------
  function manejarEscaneo(codigo) {
    scanner.pause(); // pausamos para no leer el mismo QR 20 veces por segundo

    const yaIngreso = buscarIngresoPrevio(codigo);
    if (yaIngreso) {
      // Ya había entrado antes: avisamos y no dejamos registrar de nuevo
      document.getElementById("aviso-duplicado").style.display = "block";
      document.getElementById("aviso-duplicado").textContent =
        `⚠️ Este código ya ingresó el ${yaIngreso.hora} (manilla: ${yaIngreso.manilla_entregada ? "sí entregada" : "no entregada"}).`;
      document.getElementById("resultado").style.display = "none";
      document.getElementById("btnSiguiente").style.display = "block";
      return;
    }

    const datos = JSON.parse(localStorage.getItem("evento_lookup"));
    const persona = datos[codigo];

    document.getElementById("aviso-duplicado").style.display = "none";

    if (!persona) {
      alert("Código no encontrado en los datos del evento. Verifica el QR.");
      document.getElementById("btnSiguiente").style.display = "block";
      return;
    }

    // Revisamos y mostramos, con la misma lógica que usa la búsqueda por documento
    procesarPersonaEncontrada(codigo, persona);
  }

  // ---------- Función compartida: revisa duplicado y muestra a la persona ----------
  // La usan el escaneo de QR Y la búsqueda por número de documento.
  function procesarPersonaEncontrada(codigo, persona) {
    const yaIngreso = buscarIngresoPrevio(codigo);
    if (yaIngreso) {
      document.getElementById("aviso-duplicado").style.display = "block";
      document.getElementById("aviso-duplicado").textContent =
        `⚠️ Esta persona ya ingresó el ${yaIngreso.hora} (manilla: ${yaIngreso.manilla_entregada ? "sí entregada" : "no entregada"}).`;
      document.getElementById("resultado").style.display = "none";
      document.getElementById("btnSiguiente").style.display = "block";
      return;
    }
    document.getElementById("aviso-duplicado").style.display = "none";
    mostrarPersonaParaConfirmar(codigo, persona);
  }

  // ---------- Función compartida: muestra los datos y los botones de confirmar ----------
  // La usan tanto el escaneo de QR como el registro manual de usuario nuevo.
  function mostrarPersonaParaConfirmar(codigo, persona) {
    codigoActual = codigo;
    document.getElementById("res-manilla").textContent = "Manilla: " + persona["Color de manilla"];
    document.getElementById("res-nombre").textContent = persona["Nombre"];
    document.getElementById("res-tipodoc").textContent = persona["tipo de documento"];
    document.getElementById("res-numdoc").textContent = persona["numero de documento"];
    document.getElementById("res-especificaciones").textContent = persona["especificaciones del equipo"];
    document.getElementById("resultado").style.display = "block";
  }

  // ---------- Registrar un usuario nuevo, sin QR previo ----------
  document.getElementById("btnNuevoUsuario").addEventListener("click", () => {
    document.getElementById("form-nuevo-usuario").style.display = "block";
  });

  document.getElementById("btnCancelarNuevoUsuario").addEventListener("click", () => {
    document.getElementById("form-nuevo-usuario").style.display = "none";
  });

  document.getElementById("btnGuardarNuevoUsuario").addEventListener("click", () => {
    const nombre = document.getElementById("nu-nombre").value.trim();
    const tipodoc = document.getElementById("nu-tipodoc").value.trim();
    const numdoc = document.getElementById("nu-numdoc").value.trim();
    const manilla = document.getElementById("nu-manilla").value.trim();
    const especificaciones = document.getElementById("nu-especificaciones").value.trim();

    if (!nombre || !numdoc) {
      alert("Nombre y número de documento son obligatorios.");
      return;
    }

    const datos = JSON.parse(localStorage.getItem("evento_lookup") || "{}");

    // Revisar si ya existe alguien con el mismo nombre y documento, para
    // no crear un duplicado sin querer
    const claveNueva = nombre.toLowerCase() + "||" + numdoc;
    const yaExiste = Object.keys(datos).some((codigoExistente) => {
      const p = datos[codigoExistente];
      const claveExistente = String(p["Nombre"] || "").toLowerCase().trim() + "||" + String(p["numero de documento"] || "").trim();
      return claveExistente === claveNueva;
    });

    if (yaExiste) {
      alert("Ya existe un registro con ese nombre y documento. Usa la cámara para escanear su QR en vez de crear uno nuevo.");
      return;
    }

    // Generamos un código único local, distinto a los que vienen del correo
    const codigoNuevo = "MANUAL-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();

    const persona = {
      "Nombre": nombre,
      "tipo de documento": tipodoc,
      "numero de documento": numdoc,
      "Color de manilla": manilla,
      "especificaciones del equipo": especificaciones
    };

    // Lo agregamos a los mismos datos del evento guardados en el celular,
    // para que quede disponible igual que cualquier persona pre-registrada
    datos[codigoNuevo] = persona;
    localStorage.setItem("evento_lookup", JSON.stringify(datos));

    // Limpiamos el formulario y lo ocultamos
    document.getElementById("form-nuevo-usuario").style.display = "none";
    document.getElementById("nu-nombre").value = "";
    document.getElementById("nu-tipodoc").value = "";
    document.getElementById("nu-numdoc").value = "";
    document.getElementById("nu-manilla").value = "";
    document.getElementById("nu-especificaciones").value = "";

    // Lo mostramos igual que si hubiera sido escaneado, con los botones
    // de confirmar si se entrega la manilla o no
    mostrarPersonaParaConfirmar(codigoNuevo, persona);
  });

  // ---------- Buscar por número de documento (respaldo si falla la cámara) ----------
  document.getElementById("btnBuscarDocumento").addEventListener("click", () => {
    document.getElementById("form-buscar-documento").style.display = "block";
  });

  document.getElementById("btnCancelarBusqueda").addEventListener("click", () => {
    document.getElementById("form-buscar-documento").style.display = "none";
  });

  document.getElementById("btnEjecutarBusqueda").addEventListener("click", () => {
    const numdocBuscado = document.getElementById("bd-numdoc").value.trim();
    if (!numdocBuscado) {
      alert("Escribe un número de documento para buscar.");
      return;
    }

    const datos = JSON.parse(localStorage.getItem("evento_lookup") || "{}");

    let codigoEncontrado = null;
    let personaEncontrada = null;
    for (const codigo in datos) {
      if (String(datos[codigo]["numero de documento"] || "").trim() === numdocBuscado) {
        codigoEncontrado = codigo;
        personaEncontrada = datos[codigo];
        break;
      }
    }

    if (!personaEncontrada) {
      alert("No se encontró ningún registro con ese número de documento.");
      return;
    }

    document.getElementById("form-buscar-documento").style.display = "none";
    document.getElementById("bd-numdoc").value = "";

    procesarPersonaEncontrada(codigoEncontrado, personaEncontrada);
  });

  // ---------- PASO 4: el staff confirma si entregó la manilla o no ----------
  function confirmarIngreso(entregada) {
    const datos = JSON.parse(localStorage.getItem("evento_lookup"));
    const persona = datos[codigoActual];

    const registro = JSON.parse(localStorage.getItem("ingresos_registrados") || "[]");
    registro.push({
      codigo: codigoActual,
      nombre: persona["Nombre"],
      hora: new Date().toLocaleString(),
      manilla_entregada: entregada
    });
    localStorage.setItem("ingresos_registrados", JSON.stringify(registro));

    document.getElementById("resultado").style.display = "none";
    document.getElementById("btnSiguiente").style.display = "block";
  }

  document.getElementById("btnEntregada").addEventListener("click", () => confirmarIngreso(true));
  document.getElementById("btnNoEntregada").addEventListener("click", () => confirmarIngreso(false));

  // ---------- PASO 5: volver a escanear a la siguiente persona ----------
  document.getElementById("btnSiguiente").addEventListener("click", () => {
    document.getElementById("btnSiguiente").style.display = "none";
    document.getElementById("aviso-duplicado").style.display = "none";
    scanner.resume();
  });

  // ---------- Buscar si un código ya fue registrado antes ----------
  function buscarIngresoPrevio(codigo) {
    const registro = JSON.parse(localStorage.getItem("ingresos_registrados") || "[]");
    return registro.find((r) => r.codigo === codigo) || null;
  }

  // ---------- Exportar el registro de ingresos a un archivo descargable ----------
  // Convertida en función reutilizable: la usa tanto el botón de exportar
  // solo, como el botón de "Exportar y borrar" (para nunca borrar sin
  // haber exportado primero). Devuelve true si sí había algo que exportar.
  function exportarRegistroDeIngresos() {
    const registro = JSON.parse(localStorage.getItem("ingresos_registrados") || "[]");
    if (registro.length === 0) {
      return false;
    }

    // Armamos un texto tipo CSV: primero los encabezados, luego una línea por registro
    let csv = "codigo,nombre,hora,manilla_entregada\n";
    registro.forEach((r) => {
      csv += `${r.codigo},"${r.nombre}",${r.hora},${r.manilla_entregada ? "si" : "no"}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const enlace = document.createElement("a");
    enlace.href = url;
    enlace.download = "registro_ingresos.csv";
    enlace.click();
    return true;
  }

  document.getElementById("btnExportar").addEventListener("click", () => {
    const seExporto = exportarRegistroDeIngresos();
    if (!seExporto) {
      alert("Todavía no hay ningún ingreso registrado.");
    }
  });

  // ---------- Borrar todos los datos guardados en este celular ----------
  // Ahora SIEMPRE exporta primero (si hay algo que exportar), nunca borra
  // sin haber descargado antes el registro de ingresos.
  function borrarTodo(pedirConfirmacion = true) {
    if (pedirConfirmacion) {
      const confirmado = confirm(
        "Esto va a descargar el registro de ingresos (si hay alguno) y luego " +
        "borrar TODOS los datos del evento de este celular. ¿Continuar?"
      );
      if (!confirmado) {
        return;
      }
      exportarRegistroDeIngresos();
    }
    localStorage.removeItem("evento_lookup");
    localStorage.removeItem("evento_cargado_en");
    localStorage.removeItem("ingresos_registrados");
    actualizarEstado();
  }

  document.getElementById("btnBorrar").addEventListener("click", () => borrarTodo(true));

  // ---------- Al abrir la app, revisamos si ya había datos cargados ----------
  // Ya no iniciamos la cámara sola aquí tampoco, por el mismo motivo: en
  // el celular, tiene que ser un toque directo del botón, no algo automático.
  actualizarEstado();

</script>

</body>
</html>
